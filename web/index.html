<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FirstVue — Discover, verify, and choose trusted beauty and service businesses.">
  <meta property="og:title" content="FirstVue">
  <meta property="og:description" content="Discover, verify, and choose trusted local beauty and service pros.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="FirstVue">
  <meta name="twitter:description" content="Discover, verify, and choose trusted local beauty and service pros.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FirstVue">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FirstVue</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="canvaskit/canvaskit.wasm" as="fetch" type="application/wasm" crossorigin>
  <link rel="preload" href="main.dart.js" as="script">
  <script src="seo-bootstrap.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #F7F5F2;
    }
    #fv-boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, "Times New Roman", serif;
      color: #C9A227;
      font-size: 28px;
      letter-spacing: 0.12em;
    }
    /* Keep browser autofill from painting unreadably on auth fields. */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: #F4EFE6 !important;
      caret-color: #3DD9C9;
      box-shadow: 0 0 0 1000px #1C1829 inset !important;
      transition: background-color 99999s ease-out;
    }
  </style>
</head>
<body>
  <div id="fv-boot">FirstVue</div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
