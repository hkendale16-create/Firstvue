# Netlify builds Flutter on their servers when connected to Git.
# Manual drag-and-drop: upload the contents of build/web only (see NETLIFY_DEPLOY.md).

[build]
  command = "bash scripts/build-web.sh"
  publish = "build/web"

[build.environment]
  # Flutter web builds can take several minutes on first deploy.
  NODE_VERSION = "20"

# Legal / App Links must not fall through to the Flutter SPA shell.
[[redirects]]
  from = "/privacy.html"
  to = "/privacy.html"
  status = 200
  force = true

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200
  force = true

[[redirects]]
  from = "/terms.html"
  to = "/terms.html"
  status = 200
  force = true

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/*"
  to = "/.well-known/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Flutter CanvasKit fetches images/videos via XHR (connect-src), not img-src.
    # Media lives on *.storage.supabase.co and signed/CDN URLs, so https/wss
    # must be allowed or the app paints with empty avatars, VUE, and feeds.
    # Google Identity Services (Continue with Google ID-token path) needs
    # accounts.google.com for script + iframe, plus gstatic already allowed.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://www.gstatic.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com https://www.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' blob: data: https: wss:; frame-src https://js.stripe.com https://hooks.stripe.com https://accounts.google.com; worker-src 'self' blob:; child-src 'self' blob:;"

# HTML and entry JS change every deploy — always revalidate.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/main.dart.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CanvasKit / hashed assets rarely change; let the phone keep them for a week.
[[headers]]
  for = "/canvaskit/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"
