# Netlify builds Flutter on their servers when connected to Git.
# Manual drag-and-drop: upload the contents of build/web only (see NETLIFY_DEPLOY.md).

[build]
  command = "bash scripts/build-web.sh"
  publish = "build/web"

[build.environment]
  # Flutter web builds can take several minutes on first deploy.
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Flutter CanvasKit fetches images/videos via XHR (connect-src), not img-src.
    # Media lives on *.storage.supabase.co and signed/CDN URLs, so https/wss
    # must be allowed or the app paints with empty avatars, VUE, and feeds.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://www.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' blob: data: https: wss:; frame-src https://js.stripe.com https://hooks.stripe.com; worker-src 'self' blob:; child-src 'self' blob:;"

# CanvasKit / fonts rarely change; let the phone keep them for a week.
[[headers]]
  for = "/canvaskit/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
