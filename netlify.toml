# Netlify builds Flutter on their servers when connected to Git.
# Manual drag-and-drop: upload the contents of build/web only (see NETLIFY_DEPLOY.md).

[build]
  command = "bash scripts/build-web.sh"
  publish = "build/web"

[build.environment]
  # Flutter web builds can take several minutes on first deploy.
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Flutter web loads CanvasKit JS/WASM from www.gstatic.com unless built with
    # --no-web-resources-cdn. Blocking that host paints a blank page.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://www.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' blob: https://www.gstatic.com https://fonts.gstatic.com https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://*.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; worker-src 'self' blob:; child-src 'self' blob:;"
