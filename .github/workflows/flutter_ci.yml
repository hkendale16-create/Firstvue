name: FirstVue CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib test

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --no-wasm-dry-run --no-web-resources-cdn --pwa-strategy=none --dart-define=FIRSTVUE_OAUTH_GOOGLE=true

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: firstvue-web
          path: build/web
